<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ktools</title>
    
    <!-- Configuration Manifeste et PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ktools">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#020617">

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --text-main: #f1f5f9;
            --text-calc: #ffffff;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --nav-bg: #0f172a;
            --card-bg: #1e293b;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-main: #0f172a;
            --text-calc: #000000;
            --nav-bg: #ffffff;
            --card-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* Navigation Responsive */
        nav {
            display: flex;
            background-color: var(--nav-bg);
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        /* Switch to vertical on landscape */
        @media (orientation: landscape) {
            body { flex-direction: row-reverse; }
            nav {
                flex-direction: column;
                width: 80px;
                height: 100vh;
                border-bottom: none;
                border-left: 1px solid rgba(128, 128, 128, 0.2);
                justify-content: center;
                gap: 15px;
            }
        }

        .nav-item {
            flex: 1;
            padding: 5px 0;
            border: none;
            background: none;
            color: var(--text-main);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item i { width: 24px; height: 24px; }
        .nav-item.active { color: var(--accent-blue); }

        main { flex: 1; position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        .view {
            display: none;
            height: 100%;
            width: 100%;
            padding: 20px;
            flex-direction: column;
            animation: fadeIn 0.2s ease-out;
            position: relative;
        }

        .view.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- CALCULATRICE --- */
        .calc-container { display: flex; flex-direction: column; height: 100%; }
        .calc-screen { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 10px 20px; }
        #calc-res { font-size: 3.5rem; font-weight: bold; color: var(--text-calc); word-break: break-all; }
        .calc-history { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 5px; opacity: 0.8; height: 1.5rem; }
        .calc-keyboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 5px 0; height: 65%; }
        .calc-btn { border: none; border-radius: 20px; background: var(--card-bg); color: var(--text-main); font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
        .calc-btn:active { transform: scale(0.95); background: var(--accent-blue); color: white; }
        .calc-btn.op { color: var(--accent-blue); font-size: 1.7rem; }
        .calc-btn.eq { background: var(--accent-blue); color: white; }
        .calc-btn.clear { color: #ef4444; }

        /* --- BOUSSOLE --- */
        .compass-view { align-items: center; justify-content: center; }
        .compass-container {
            position: relative;
            width: min(70vw, 70vh, 300px);
            height: min(70vw, 70vh, 300px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--accent-blue);
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }
        #compass-rose { width: 100%; height: 100%; transition: transform 0.1s linear; }
        .compass-value-center {
            position: absolute;
            z-index: 5;
            background: var(--bg-primary);
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 2rem;
            font-weight: bold;
            border: 2px solid var(--accent-blue);
            box-shadow: var(--shadow);
        }

        /* --- NIVEAU --- */
        .level-view { align-items: center; justify-content: center; gap: 20px; }
        .level-box { width: 100%; max-width: 320px; background: var(--card-bg); padding: 15px; border-radius: 25px; box-shadow: var(--shadow); text-align: center; }
        .tube-h { width: 100%; height: 50px; background: #000; border: 2px solid #444; border-radius: 25px; position: relative; overflow: hidden; margin: 10px 0; }
        .tube-v { width: 50px; height: 180px; background: #000; border: 2px solid #444; border-radius: 25px; position: relative; overflow: hidden; margin: 0 auto; }
        .bubble { position: absolute; background: radial-gradient(circle at 30% 30%, #ffffff, #86efac); border-radius: 50%; box-shadow: 0 0 15px rgba(34, 197, 94, 0.8); transition: all 0.1s ease-out; }
        .bubble-h { width: 44px; height: 40px; top: 4px; left: 50%; transform: translateX(-50%); }
        .bubble-v { width: 40px; height: 44px; left: 4px; top: 50%; transform: translateY(-50%); }
        .mark { position: absolute; left: 50%; top:0; bottom:0; width: 44px; border-left: 2px solid rgba(255,255,255,0.2); border-right: 2px solid rgba(255,255,255,0.2); transform: translateX(-50%); }
        .mark-v { position: absolute; top: 50%; left:0; right:0; height: 44px; border-top: 2px solid rgba(255,255,255,0.2); border-bottom: 2px solid rgba(255,255,255,0.2); transform: translateY(-50%); }

        /* Légende */
        .credits {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            opacity: 0.6;
        }
        .credits a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }
        .credits a:hover { color: var(--accent-blue); }
    </style>
</head>
<body data-theme="dark">

    <nav>
        <button class="nav-item active" onclick="switchView('calc', this)">
            <i data-lucide="calculator"></i>Calcul
        </button>
        <button class="nav-item" onclick="switchView('boussole', this)">
            <i data-lucide="compass"></i>Boussole
        </button>
        <button class="nav-item" onclick="switchView('niveau', this)">
            <i data-lucide="layers"></i>Niveau
        </button>
        <button class="nav-item" id="flash-btn" onclick="toggleFlash(this)">
            <i data-lucide="flashlight"></i>Flash
        </button>
        <button class="nav-item" onclick="toggleTheme()">
            <i data-lucide="sun"></i>Mode
        </button>
    </nav>

    <main>
        <!-- Calculatrice -->
        <section id="view-calc" class="view active">
            <div class="calc-container">
                <div class="calc-screen">
                    <div id="calc-hist" class="calc-history"></div>
                    <div id="calc-res">0</div>
                </div>
                <div class="calc-keyboard">
                    <button class="calc-btn clear" onclick="calcClear()">AC</button>
                    <button class="calc-btn op" onclick="calcDel()">⌫</button>
                    <button class="calc-btn op" onclick="calcOp('%')">%</button>
                    <button class="calc-btn op" onclick="calcOp('/')">/</button>
                    <button class="calc-btn" onclick="calcNum('7')">7</button>
                    <button class="calc-btn" onclick="calcNum('8')">8</button>
                    <button class="calc-btn" onclick="calcNum('9')">9</button>
                    <button class="calc-btn op" onclick="calcOp('*')">×</button>
                    <button class="calc-btn" onclick="calcNum('4')">4</button>
                    <button class="calc-btn" onclick="calcNum('5')">5</button>
                    <button class="calc-btn" onclick="calcNum('6')">6</button>
                    <button class="calc-btn op" onclick="calcOp('-')">−</button>
                    <button class="calc-btn" onclick="calcNum('1')">1</button>
                    <button class="calc-btn" onclick="calcNum('2')">2</button>
                    <button class="calc-btn" onclick="calcNum('3')">3</button>
                    <button class="calc-btn op" onclick="calcOp('+')">+</button>
                    <button class="calc-btn" style="grid-column: span 2" onclick="calcNum('0')">0</button>
                    <button class="calc-btn" onclick="calcNum('.')">,</button>
                    <button class="calc-btn eq" onclick="calcEqual()">=</button>
                </div>
            </div>
            <div class="credits">
                <a href="https://koam84-stack.github.io" target="_blank">© Ktools made by koussy crafted with IA</a>
            </div>
        </section>

        <!-- Boussole -->
        <section id="view-boussole" class="view compass-view">
            <div class="compass-container">
                <div id="comp-val" class="compass-value-center">0°</div>
                <svg id="compass-rose" viewBox="0 0 100 100">
                    <g id="rose-content">
                        <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="0.1" opacity="0.3"/>
                        <text x="50" y="12" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="bold">N</text>
                        <text x="50" y="94" text-anchor="middle" font-size="7" fill="currentColor">S</text>
                        <text x="88" y="53" text-anchor="middle" font-size="7" fill="currentColor">E</text>
                        <text x="12" y="53" text-anchor="middle" font-size="7" fill="currentColor">O</text>
                        <path d="M50 15 L46 50 L50 85 L54 50 Z" fill="url(#needleGrad)" />
                    </g>
                    <defs>
                        <linearGradient id="needleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="50%" style="stop-color:#ef4444" />
                            <stop offset="50%" style="stop-color:#3b82f6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="credits">
                <a href="https://koam84-stack.github.io" target="_blank">© Ktools made by koussy crafted with IA</a>
            </div>
        </section>

        <!-- Niveau -->
        <section id="view-niveau" class="view level-view">
            <div class="level-box">
                <div class="tube-h">
                    <div class="mark"></div>
                    <div id="bubble-h" class="bubble bubble-h"></div>
                </div>
                <div id="deg-x" style="color:var(--accent-green); font-weight:bold;">0°</div>
            </div>
            <div class="level-box" style="display:flex; align-items:center; justify-content:center; gap:20px;">
                <div class="tube-v">
                    <div class="mark-v"></div>
                    <div id="bubble-v" class="bubble bubble-v"></div>
                </div>
                <div id="deg-y" style="color:var(--accent-green); font-weight:bold; font-size: 2rem;">0°</div>
            </div>
            <div class="credits">
                <a href="https://koam84-stack.github.io" target="_blank">© Ktools made by koussy crafted with IA</a>
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
        let sensorsInitiated = false;

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            btn.classList.add('active');
            
            // Activation automatique des capteurs dès qu'on change d'onglet
            if (!sensorsInitiated && (id === 'boussole' || id === 'niveau')) {
                initSensors();
            }
        }

        function toggleTheme() {
            const b = document.body;
            const isDark = b.getAttribute('data-theme') === 'dark';
            b.setAttribute('data-theme', isDark ? 'light' : 'dark');
            const icon = document.querySelector('[onclick="toggleTheme()"] i');
            icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        // --- FLASH (Version APK corrigée) ---
        let videoTrack = null;
        async function toggleFlash(btn) {
            try {
                if (!videoTrack) {
                    const constraints = { video: { facingMode: 'environment' } };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    videoTrack = stream.getVideoTracks()[0];
                    
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.torch) {
                        await videoTrack.applyConstraints({ advanced: [{ torch: true }] });
                        btn.style.color = "#fbbf24";
                    } else {
                        alert("Flash non supporté sur ce matériel.");
                        videoTrack.stop();
                        videoTrack = null;
                    }
                } else {
                    await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
                    videoTrack.stop();
                    videoTrack = null;
                    btn.style.color = "";
                }
            } catch (e) {
                alert("Erreur Caméra/Flash : Veuillez autoriser l'accès à la caméra dans les paramètres de votre téléphone.");
            }
        }

        // --- CALCULATRICE ---
        let exp = "";
        const resEl = document.getElementById('calc-res');
        const histEl = document.getElementById('calc-hist');
        function calcNum(n) { exp = exp === "0" ? n : exp + n; render(); }
        function calcOp(op) { exp += op; render(); }
        function calcClear() { exp = ""; histEl.innerText = ""; render(); }
        function calcDel() { exp = exp.slice(0, -1); render(); }
        function render() { resEl.innerText = exp || "0"; }
        function calcEqual() {
            try {
                histEl.innerText = exp;
                exp = eval(exp.replace('×', '*').replace('÷', '/').replace('−', '-')).toString();
                render();
            } catch { exp = "Erreur"; render(); }
        }

        // --- CAPTEURS ---
        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startListening();
                        }
                    })
                    .catch(console.error);
            } else {
                startListening();
            }
        }

        function startListening() {
            sensorsInitiated = true;
            window.addEventListener('deviceorientation', (e) => {
                // Boussole
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if(heading) {
                    document.getElementById('rose-content').style.transformOrigin = "50% 50%";
                    document.getElementById('rose-content').style.transform = `rotate(${-heading}deg)`;
                    document.getElementById('comp-val').innerText = Math.round(heading) + "°";
                }
                // Niveaux
                let x = e.gamma; 
                let bH = document.getElementById('bubble-h');
                if(bH) bH.style.left = `${50 + (x/30)*40}%`;
                document.getElementById('deg-x').innerText = Math.round(x) + "°";

                let y = e.beta;
                let bV = document.getElementById('bubble-v');
                if(bV) bV.style.top = `${50 + (y/30)*40}%`;
                document.getElementById('deg-y').innerText = Math.round(y) + "°";
            });
        }

        // Tenter d'initier les capteurs dès le chargement si possible
        window.addEventListener('load', () => {
            initSensors();
        });
    </script>
</body>
</html>
