<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ktools V5.3</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#020617">

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --text: #f1f5f9;
            --accent: #3b82f6;
            --green: #22c55e;
            --danger: #ef4444;
            --nav-h: 70px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --btn-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.15);
            --btn-shadow: 6px 6px 12px #d1d5db, -4px -4px 10px #ffffff;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .splash-text {
            font-size: 2.5rem;
            font-weight: 100;
            color: white;
            letter-spacing: 12px;
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Navigation */
        nav {
            background: var(--card);
            display: flex;
            height: var(--nav-h);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 100;
            box-shadow: var(--shadow);
        }

        @media (orientation: landscape) {
            body { flex-direction: row; }
            nav { 
                flex-direction: column; 
                width: 80px; 
                height: 100vh; 
                border-bottom: none; 
                border-left: 1px solid rgba(0,0,0,0.05); 
                order: 2; 
            }
        }

        .nav-item {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            opacity: 0.3;
            transition: 0.3s;
        }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .nav-item i { width: 22px; height: 22px; }

        /* Main Container */
        main { 
            flex: 1; 
            position: relative; 
            order: 1; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            width: 100%;
            height: 100%;
            padding: 10px;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
            overflow-y: auto; /* Permet le scroll interne si nécessaire en paysage */
        }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CALCULATRICE */
        .calc-v5 { width: 100%; max-width: 500px; height: 100%; display: flex; flex-direction: column; margin: 0 auto; }
        .calc-display-zone {
            flex: 0 0 35%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 15px 25px;
        }
        #calc-history { font-size: 1.2rem; opacity: 0.5; margin-bottom: 5px; min-height: 1.4em; }
        #calc-main { font-size: 4.5rem; font-weight: 200; overflow: hidden; text-align: right; line-height: 1; }
        .calc-keypad {
            flex: 0 0 65%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
        }
        .c-btn {
            border: none;
            border-radius: 18px;
            background: var(--card);
            color: var(--text);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            box-shadow: var(--btn-shadow);
        }
        .c-btn:active { transform: scale(0.95); background: var(--accent); color: white; }
        .c-btn-alt { color: var(--accent); font-weight: bold; }
        .c-btn-eq { background: var(--accent); color: white; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); }

        /* CONTENU CENTRE (BOUSSOLE / NIVEAU / TORCHE) */
        .centered-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            padding: 10px 0;
        }

        /* BOUSSOLE V5.3 */
        .compass-v5 {
            width: min(70vw, 280px); 
            height: min(70vw, 280px);
            background: var(--card);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
        }
        #compass-disk { width: 100%; height: 100%; transition: transform 0.1s linear; }
        #comp-val {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 200;
            z-index: 10;
            pointer-events: none;
            background: var(--card);
            padding: 5px 10px;
            border-radius: 10px;
        }

        /* NIVEAU V5.3 */
        .level-v5-box { 
            background: var(--card); 
            width: 100%; 
            max-width: 300px; 
            padding: 20px; 
            border-radius: 24px; 
            box-shadow: var(--shadow);
        }
        .tube-v5 { 
            height: 40px; 
            background: #000; 
            border-radius: 20px; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        }
        .bubble-v5 { 
            position: absolute; 
            background: radial-gradient(circle at 30% 30%, #fff, var(--green)); 
            border-radius: 50%; 
            box-shadow: 0 0 15px var(--green);
        }

        /* TORCHE */
        .torch-v5-wrap {
            width: min(40vw, 160px); 
            height: min(40vw, 160px);
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: 0.4s;
        }
        .torch-active { background: var(--accent); box-shadow: 0 0 50px var(--accent); transform: scale(1.1); color: white; }

        /* Footer Fixe */
        .v5-footer { 
            font-size: 10px; 
            opacity: 0.4; 
            padding: 10px 0;
            text-align: center;
            font-weight: 300;
            width: 100%;
            flex-shrink: 0;
            border-top: 1px solid rgba(0,0,0,0.02);
        }
        
        /* Ajustements Landscape */
        @media (orientation: landscape) {
            .centered-content { flex-direction: row; flex-wrap: wrap; gap: 40px; }
            .calc-v5 { flex-direction: row; }
            .calc-display-zone { flex: 0 0 40%; height: 100%; justify-content: center; }
            .calc-keypad { flex: 0 0 60%; height: 100%; }
            #calc-main { font-size: 3rem; }
            .level-v5-box { max-width: 200px; }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="splash">
        <div class="splash-text">KTOOLS</div>
    </div>

    <nav>
        <button class="nav-item active" onclick="setView('calc', this)"><i data-lucide="calculator"></i>Calcul</button>
        <button class="nav-item" onclick="setView('compass', this)"><i data-lucide="compass"></i>Boussole</button>
        <button class="nav-item" onclick="setView('level', this)"><i data-lucide="layers"></i>Niveau</button>
        <button class="nav-item" onclick="setView('torch', this)"><i data-lucide="flashlight"></i>Flash</button>
        <button class="nav-item" onclick="toggleTheme()"><i data-lucide="sun"></i>Thème</button>
    </nav>

    <main>
        <!-- CALCULATRICE -->
        <section id="v-calc" class="view active">
            <div class="calc-v5">
                <div class="calc-display-zone">
                    <div id="calc-history"></div>
                    <div id="calc-main">0</div>
                </div>
                <div class="calc-keypad">
                    <button class="c-btn c-btn-alt" onclick="cAction('AC')">AC</button>
                    <button class="c-btn c-btn-alt" onclick="cAction('DEL')">⌫</button>
                    <button class="c-btn c-btn-alt" onclick="cAdd('%')">%</button>
                    <button class="c-btn c-btn-alt" onclick="cAdd('/')">÷</button>
                    
                    <button class="c-btn" onclick="cAdd('7')">7</button>
                    <button class="c-btn" onclick="cAdd('8')">8</button>
                    <button class="c-btn" onclick="cAdd('9')">9</button>
                    <button class="c-btn c-btn-alt" onclick="cAdd('*')">×</button>
                    
                    <button class="c-btn" onclick="cAdd('4')">4</button>
                    <button class="c-btn" onclick="cAdd('5')">5</button>
                    <button class="c-btn" onclick="cAdd('6')">6</button>
                    <button class="c-btn c-btn-alt" onclick="cAdd('-')">-</button>
                    
                    <button class="c-btn" onclick="cAdd('1')">1</button>
                    <button class="c-btn" onclick="cAdd('2')">2</button>
                    <button class="c-btn" onclick="cAdd('3')">3</button>
                    <button class="c-btn c-btn-alt" onclick="cAdd('+')">+</button>
                    
                    <button class="c-btn" style="grid-column: span 2" onclick="cAdd('0')">0</button>
                    <button class="c-btn" onclick="cAdd('.')">,</button>
                    <button class="c-btn c-btn-eq" onclick="cResult()">=</button>
                </div>
            </div>
            <div class="v5-footer">Ktools V5.3 made by koussy, crafted with IA</div>
        </section>

        <!-- BOUSSOLE -->
        <section id="v-compass" class="view">
            <div class="centered-content">
                <div class="compass-v5">
                    <div id="comp-val">0°</div>
                    <svg id="compass-disk" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
                        <text x="50" y="10" text-anchor="middle" font-weight="bold" fill="var(--danger)" font-size="8">N</text>
                        <text x="50" y="93" text-anchor="middle" fill="currentColor" font-size="6">S</text>
                        <text x="90" y="52" text-anchor="middle" fill="currentColor" font-size="6">E</text>
                        <text x="10" y="52" text-anchor="middle" fill="currentColor" font-size="6">O</text>
                        <path d="M50 18 L47 50 L50 82 L53 50 Z" fill="var(--accent)"/>
                        <circle cx="50" cy="50" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <div class="v5-footer">Ktools V5.3 made by koussy, crafted with IA</div>
        </section>

        <!-- NIVEAU -->
        <section id="v-level" class="view">
            <div class="centered-content">
                <div class="level-v5-box">
                    <div class="tube-v5">
                        <div id="bub-h" class="bubble-v5" style="width: 32px; height: 32px; top: 4px; left: 50%; transform: translateX(-50%);"></div>
                    </div>
                    <p id="txt-h" style="text-align: center; margin-top:10px; font-size: 1.1rem;">0.0°</p>
                </div>
                <div class="level-v5-box" style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <div class="tube-v5" style="width: 40px; height: 140px;">
                        <div id="bub-v" class="bubble-v5" style="width: 32px; height: 32px; left: 4px; top: 50%; transform: translateY(-50%);"></div>
                    </div>
                    <p id="txt-v" style="font-size: 2rem; font-weight: 100;">0.0°</p>
                </div>
            </div>
            <div class="v5-footer">Ktools V5.3 made by koussy, crafted with IA</div>
        </section>

        <!-- TORCHE -->
        <section id="v-torch" class="view">
            <div class="centered-content">
                <div id="torch-trigger" class="torch-v5-wrap" onclick="toggleFlash()">
                    <i data-lucide="flashlight" style="width: 60px; height: 60px;"></i>
                </div>
                <p style="margin-top:20px; letter-spacing: 5px; opacity: 0.5; font-size: 0.8rem;">TORCHE</p>
            </div>
            <div class="v5-footer">Ktools V5.3 made by koussy, crafted with IA</div>
        </section>
    </main>

    <script>
        lucide.createIcons();

        // SPLASH SCREEN
        window.addEventListener('load', () => {
            setTimeout(() => {
                const s = document.getElementById('splash');
                if (s) {
                    s.style.opacity = '0';
                    setTimeout(() => s.remove(), 600);
                }
                initSensors();
            }, 1500);
        });

        // NAVIGATION
        function setView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('v-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // CALCULATRICE
        let exp = "";
        const mDisp = document.getElementById('calc-main');
        const hDisp = document.getElementById('calc-history');

        function cAdd(char) {
            if (exp === "0" && char !== ".") exp = "";
            exp += char;
            mDisp.innerText = exp;
        }

        function cAction(act) {
            if (act === 'AC') exp = "";
            if (act === 'DEL') exp = exp.slice(0, -1);
            mDisp.innerText = exp || "0";
            hDisp.innerText = "";
        }

        function cResult() {
            if (!exp) return;
            try {
                hDisp.innerText = exp + " =";
                let evalExp = exp.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
                exp = eval(evalExp).toString();
                mDisp.innerText = exp;
            } catch {
                mDisp.innerText = "Erreur";
                exp = "";
            }
        }

        // FLASH
        let tStream = null;
        async function toggleFlash() {
            const btn = document.getElementById('torch-trigger');
            try {
                if (!tStream) {
                    tStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    const track = tStream.getVideoTracks()[0];
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                    btn.classList.add('torch-active');
                } else {
                    const track = tStream.getVideoTracks()[0];
                    await track.applyConstraints({ advanced: [{ torch: false }] });
                    tStream.getTracks().forEach(t => t.stop());
                    tStream = null;
                    btn.classList.remove('torch-active');
                }
            } catch (err) {
                alert("Permission Caméra nécessaire pour le flash.");
            }
        }

        // THEME
        function toggleTheme() {
            const b = document.body;
            const current = b.getAttribute('data-theme');
            b.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            lucide.createIcons();
        }

        // CAPTEURS
        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response == 'granted') window.addEventListener('deviceorientation', handleSensors);
                });
            } else {
                window.addEventListener('deviceorientation', handleSensors, true);
            }
        }

        function handleSensors(e) {
            // Boussole
            let heading = e.webkitCompassHeading || (360 - e.alpha);
            if (heading) {
                document.getElementById('compass-disk').style.transform = `rotate(${-heading}deg)`;
                document.getElementById('comp-val').innerText = Math.round(heading) + "°";
            }

            // Niveau (Butées physiques pour éviter que la bulle ne sorte)
            let x = e.gamma; 
            let y = e.beta;  

            // Limite la bulle à +/- 40% pour rester dans le logement (tube de 40px)
            let posX = Math.max(-42, Math.min(42, x)); 
            document.getElementById('bub-h').style.left = `calc(50% + ${posX}% - 16px)`;
            document.getElementById('txt-h').innerText = x.toFixed(1) + "°";

            let posY = Math.max(-42, Math.min(42, y));
            document.getElementById('bub-v').style.top = `calc(50% + ${posY}% - 16px)`;
            document.getElementById('txt-v').innerText = y.toFixed(1) + "°";
        }
    </script>
</body>
</html>
